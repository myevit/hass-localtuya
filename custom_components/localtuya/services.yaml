reload:
  name: "Reload"
  description: Reload localtuya and reconnect to all devices.

set_dp:
  name: "Set DP Value"
  description: Change the value of a datapoint (DP)
  fields:
    device_id:
      name: "Device ID"
      description: The device ID of the device where the datapoint value needs to be changed
      required: true
      example: 11100118278aab4de001
      selector:
        text:
    dp:
      name: "DP"
      description: Target DP, Datapoint index
      required: false
      example: 1
      selector:
        number:
          mode: box
    value:
      name: "Value"
      description: "A new value to set or a list of DP-value pairs. If a list is provided, the target DP will be ignored"
      required: true
      example: '{ "1": True, "2": True }'
      selector:
        object:

update_dps:
  name: "Update DPs"
  description: "Request the device to report current values for specified datapoints (sends UPDATEDPS 0x12 command)"
  fields:
    device_id:
      name: "Device ID"
      description: The Tuya device ID to request updated DP values from
      required: true
      example: 11100118278aab4de001
      selector:
        text:
    dps:
      name: "DPs"
      description: "List of DP indexes to refresh. If omitted, all detected and whitelisted DPs will be refreshed."
      required: false
      example: "[18, 19, 20]"
      selector:
        object:

remote_add_code:
  name: "Add Remote Code"
  description: Add the remote code to the device's remote storage.
  fields:
    target:
      name: "Choose remote device"
      description: "Select the remote to store the code on it"
      required: true
      selector:
        device:
          multiple: false
          entity:
            domain: "remote"
          filter:
            integration: "localtuya"
    device_name:
      name: "Device Name"
      description: The name of the device to store the code in
      required: true
      example: TV
      selector:
        text:
    command_name:
      name: "Command Name"
      description: The command name to use when calling it
      required: true
      example: volume_up
      selector:
        text:
    base64:
      name: "Base64 Code"
      description: The Base64 code (this will override the head/key values)
      required: false
      selector:
        text:
    head:
      name: "Head"
      description: "The header can be found in the Tuya IoT device debug logs, Key's required"
      required: false
      selector:
        text:
    key:
      name: "Key"
      description: "The key can be found in the Tuya IoT device debug logs, Head's required"
      required: false
      selector:
        text:

set_feeder_schedule:
  name: "Set feeder schedule"
  description: "Replace the complete native FT-11W schedule and wait for a genuine DP1 receipt. No retries."
  fields:
    entity_id:
      name: "Native meal plan"
      required: true
      selector:
        entity:
          filter:
            integration: "localtuya"
            domain: "sensor"
          multiple: false
    expected_revision:
      name: "Expected revision"
      required: true
      selector:
        number:
          min: 0
          mode: "box"
    acknowledge_restored_snapshot:
      name: "Acknowledge restored snapshot"
      description: "Required for a restored plan. It is not a current device query."
      default: false
      selector:
        boolean: {}
    meals:
      name: "Complete schedule"
      required: true
      selector:
        object: {}
add_feeder_meal:
  name: "Add feeder meal"
  description: "Replace the complete native FT-11W schedule and wait for a genuine DP1 receipt. No retries."
  fields:
    entity_id:
      name: "Native meal plan"
      required: true
      selector:
        entity:
          filter:
            integration: "localtuya"
            domain: "sensor"
          multiple: false
    expected_revision:
      name: "Expected revision"
      required: true
      selector:
        number:
          min: 0
          mode: "box"
    acknowledge_restored_snapshot:
      name: "Acknowledge restored snapshot"
      description: "Required for a restored plan. It is not a current device query."
      default: false
      selector:
        boolean: {}
    meal:
      name: "Complete meal record"
      required: true
      selector:
        object: {}
update_feeder_meal:
  name: "Update feeder meal"
  description: "Replace the complete native FT-11W schedule and wait for a genuine DP1 receipt. No retries."
  fields:
    entity_id:
      name: "Native meal plan"
      required: true
      selector:
        entity:
          filter:
            integration: "localtuya"
            domain: "sensor"
          multiple: false
    expected_revision:
      name: "Expected revision"
      required: true
      selector:
        number:
          min: 0
          mode: "box"
    acknowledge_restored_snapshot:
      name: "Acknowledge restored snapshot"
      description: "Required for a restored plan. It is not a current device query."
      default: false
      selector:
        boolean: {}
    meal_index:
      name: "Zero-based meal index"
      required: true
      selector:
        number:
          min: 0
          max: 9
          mode: "box"
    meal:
      name: "Complete meal record"
      required: true
      selector:
        object: {}
delete_feeder_meal:
  name: "Delete feeder meal"
  description: "Replace the complete native FT-11W schedule and wait for a genuine DP1 receipt. No retries."
  fields:
    entity_id:
      name: "Native meal plan"
      required: true
      selector:
        entity:
          filter:
            integration: "localtuya"
            domain: "sensor"
          multiple: false
    expected_revision:
      name: "Expected revision"
      required: true
      selector:
        number:
          min: 0
          mode: "box"
    acknowledge_restored_snapshot:
      name: "Acknowledge restored snapshot"
      description: "Required for a restored plan. It is not a current device query."
      default: false
      selector:
        boolean: {}
    meal_index:
      name: "Zero-based meal index"
      required: true
      selector:
        number:
          min: 0
          max: 9
          mode: "box"
feed:
  name: "Feed"
  description: "Publish DP3 once; no retries or DP2. Unknown outcomes must not be retried."
  fields:
    entity_id:
      name: "Native meal plan"
      required: true
      selector:
        entity:
          filter:
            integration: "localtuya"
            domain: "sensor"
          multiple: false
    portions:
      name: "Confirmed portions"
      required: true
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: "box"
    confirmed:
      name: "Quantity explicitly confirmed"
      description: "Confirm the selected quantity before dispensing."
      required: true
      selector:
        boolean: {}
