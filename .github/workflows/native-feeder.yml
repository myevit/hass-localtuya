name: Native feeder offline qualification
on:
  pull_request:
  push:
    branches: [feat/ft11w-feeder]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ha:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements_feeder_test.txt
      - run: python -m pip install -r requirements_feeder_test.txt black==24.8.0
      - name: Public added-line privacy gate
        run: python scripts/check_feeder_public.py
      - name: Python formatting
        run: python -m black --check custom_components/localtuya
      - name: Real HA services and encrypted protocol, no TCP or UDP
        run: python -m pytest feeder_tests -q --disable-socket --allow-unix-socket
  upstream-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Separate legacy fixture environment
        run: python -m pip install homeassistant==2025.1.0 pytest==9.2.0 pytest-asyncio==1.4.1 pytest-socket==0.8.1 pytest-cov==7.1.0
      - name: Upstream compatibility, no TCP or UDP
        run: python -m pytest tests -q --disable-socket --allow-unix-socket
